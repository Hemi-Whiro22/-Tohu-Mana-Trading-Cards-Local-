<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tohu Mana Trading</title>
    <link rel="icon" type="image/png" href="/tohu_mana_trading.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #991b1b;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #dc2626;
      }
      .bg-mana-overlay {
        position: fixed;
        inset: 0;
        /* Adjusted radial gradient to center the "clear" spot more towards the left-center where the image moved */
        background: radial-gradient(circle at 40% 60%, transparent 0%, #000000 85%),
                    linear-gradient(to top, #000000 0%, transparent 40%);
        z-index: 1;
        pointer-events: none;
      }
      .bg-mana-image {
        position: fixed;
        bottom: 0;
        /* Shifted right to pull the image more towards the left of the screen */
        right: 15%; 
        width: 100%;
        height: 100%;
        max-width: 1200px;
        max-height: 1200px;
        opacity: 0.55;
        z-index: 0;
        filter: saturate(1.1) contrast(1.2) brightness(0.9) drop-shadow(0 0 25px rgba(153, 27, 27, 0.5));
        object-fit: contain;
        /* Positioned so Whiro is more visible on the left side of his own container */
        object-position: bottom center; 
        mask-image: radial-gradient(circle at center, black 50%, transparent 95%);
        -webkit-mask-image: radial-gradient(circle at center, black 50%, transparent 95%);
      }
      /* Custom utility for the 'mean' look */
      .mean-glow {
        box-shadow: 0 0 15px rgba(153, 27, 27, 0.4);
      }
      .mean-border {
        border-color: rgba(153, 27, 27, 0.6);
      }
    </style>
